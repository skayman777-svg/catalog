<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style></head><body>
<title>Каталог оборудования «Нордпривод»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f2f0eb;--surface:#ffffff;--surface-2:#f8f7f4;--ink:#14181d;--muted:#59606a;--line:#d9d5cb;--line-2:#e9e6de;
  --accent:#0b5cad;--accent-ink:#ffffff;--accent-tint:#e3edf9;
  --cta:#b83c0a;--cta-ink:#ffffff;
  --ok:#17784a;--ok-tint:#e1f2e9;--warn:#935300;--warn-tint:#fbefd9;--bad:#b42318;--bad-tint:#fbe4e1;
  --il-line:#27313b;--il-fill:#eef1f4;--il-accent:#cfe0f3;
  --rib-bg:#14181d;--rib-ink:#f2f0eb;
  --shadow:0 1px 2px rgba(20,24,29,.06),0 8px 24px rgba(20,24,29,.07);
  --radius:8px;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-head:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Arial Narrow',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161a;--surface:#1b1f24;--surface-2:#20252b;--ink:#ecebe6;--muted:#9ba2ab;--line:#31383f;--line-2:#282e34;
    --accent:#6aa9ea;--accent-ink:#0b1622;--accent-tint:#1c2c3f;
    --cta:#f08a4b;--cta-ink:#1c1008;
    --ok:#55c08b;--ok-tint:#17302440;--warn:#e3a54c;--warn-tint:#3a2d1440;--bad:#f2877d;--bad-tint:#3d1d1a40;
    --il-line:#c9d3de;--il-fill:#252b32;--il-accent:#27405c;--rib-bg:#0a0c0f;--rib-ink:#c9d0d8;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13161a;--surface:#1b1f24;--surface-2:#20252b;--ink:#ecebe6;--muted:#9ba2ab;--line:#31383f;--line-2:#282e34;
  --accent:#6aa9ea;--accent-ink:#0b1622;--accent-tint:#1c2c3f;
  --cta:#f08a4b;--cta-ink:#1c1008;
  --ok:#55c08b;--ok-tint:#17302440;--warn:#e3a54c;--warn-tint:#3a2d1440;--bad:#f2877d;--bad-tint:#3d1d1a40;
  --il-line:#c9d3de;--il-fill:#252b32;--il-accent:#27405c;--rib-bg:#0a0c0f;--rib-ink:#c9d0d8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:60}
button,input,select,textarea{font:inherit;color:inherit}
button,label,summary,select{-webkit-tap-highlight-color:transparent}
.btn:active,.icon-btn:active{filter:brightness(.94)}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
a{color:var(--accent)}
.wrap{max-width:1280px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-mono);font-feature-settings:"zero" 1}
.nb{white-space:nowrap}

/* ribbon + header */
.ribbon{background:var(--rib-bg);color:var(--rib-ink);font-size:12px;letter-spacing:.01em}
.ribbon .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding-block:6px}
.ribbon .tag{font-weight:600;letter-spacing:.14em;background:var(--cta);color:var(--cta-ink);padding:1px 7px;border-radius:3px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left}
.brand svg{width:36px;height:36px;color:var(--accent);flex:none}
.brand-name{display:block;font:600 21px/1 var(--font-head);letter-spacing:.01em}
.brand-sub{display:block;margin-top:4px;font:500 10px/1.1 var(--font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current=page]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}
.nav .mini{font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:6px;color:var(--muted)}
.search{flex:1 1 240px;max-width:480px;margin-left:auto;position:relative;display:block}
.search svg{position:absolute;left:11px;top:50%;translate:0 -50%;width:16px;height:16px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:40px;padding:0 12px 0 34px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2)}
.search input:focus{background:var(--surface);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.cta{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.btn.cta:hover{filter:brightness(1.07)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--cta);color:var(--cta-ink);font-size:12px;font-weight:600}
.badge.zero{background:var(--line);color:var(--muted)}
.icon-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);display:inline-grid;place-items:center;font-size:20px;line-height:1}
.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px}

/* layout */
.main{padding-block:22px 56px;min-height:60vh}
.catalog{display:grid;grid-template-columns:292px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 92px);overflow:auto;padding-right:6px}
.side-head,.side-foot{display:none}
.tree{display:grid;gap:10px;margin-bottom:18px}
.tg{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.tc,.tsb{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;background:none;text-align:left;padding:9px 12px}
.tc{font:600 15px/1.3 var(--font-head);letter-spacing:.01em}
.tsb{font-size:14px;color:var(--muted);padding-left:22px;border-top:1px solid var(--line-2)}
.tc:hover,.tsb:hover{background:var(--surface-2)}
.tc.on,.tsb.on{background:var(--accent-tint);color:var(--ink)}
.tc em,.tsb em{font:500 12px var(--font-mono);color:var(--muted);font-style:normal}
.filters{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.f-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line)}
.f-head h2{font:600 14px/1.2 var(--font-head);letter-spacing:.03em;text-transform:uppercase}
.hint{padding:14px;color:var(--muted);font-size:14px}
.fs{border-bottom:1px solid var(--line-2);padding:0}
.fs:last-child{border-bottom:0}
.fs summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:11px 14px;font-weight:500;font-size:14px}
.fs summary::-webkit-details-marker{display:none}
.fs summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);rotate:45deg;translate:0 -2px;transition:rotate .15s}
.fs[open] summary::after{rotate:-135deg;translate:0 2px}
.fs summary .u{margin-left:auto;margin-right:6px;font-weight:400;color:var(--muted);font-size:12px}
.fs-body{padding:0 14px 14px}
.chk{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:14px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent);margin:0;flex:none}
.chk .cnt{margin-left:auto;font:400 12px var(--font-mono);color:var(--muted)}
.chk.zero{opacity:.45}
.rng{padding:6px 7px 0}
.rng-track{position:relative;height:4px;border-radius:2px;background:var(--line);margin:12px 0 18px}
.rng-fill{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:2px}
.rng-th{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);padding:0;touch-action:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.rng-th:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.rng-in{display:flex;gap:10px}
.rng-in label{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.rng-in input{width:100%;min-width:0;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font:400 13px var(--font-mono);text-align:right}
.rng-in input:focus{border-color:var(--accent);background:var(--surface)}

/* results */
.crumbs{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:8px}
.crumbs button{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.crumbs button:hover{color:var(--ink)}
.res-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px 16px;margin-bottom:12px}
.res-head h1{font:600 30px/1.1 var(--font-head);letter-spacing:.005em;text-wrap:balance}
.res-count{color:var(--muted);font-size:14px;margin-top:4px}
.res-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel{height:36px;padding:0 30px 0 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);font-size:14px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.only-m{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:14px;background:var(--accent-tint);border:1px solid transparent;font-size:13px}
.chip button{border:0;background:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;padding:0;color:var(--muted);font-size:15px;line-height:1}
.chip button:hover{background:var(--surface);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:14px;margin-bottom:22px}
.tile{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;text-align:left;padding:0}
.tile:hover{border-color:var(--ink)}
.tile .pic{aspect-ratio:3/1.55}
.tile .tt{padding:11px 14px 13px;display:grid;gap:2px}
.tile .tt strong{font:600 17px/1.2 var(--font-head)}
.tile .tt span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,16.5rem),1fr));gap:16px}
.card{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;min-width:0}
.card:hover{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.pic{display:block;width:100%;background-color:var(--surface-2);background-image:linear-gradient(var(--line-2) 1px,transparent 1px),linear-gradient(90deg,var(--line-2) 1px,transparent 1px);background-size:16px 16px;border:0;padding:6px 10px;color:inherit}
.card .pic{aspect-ratio:3/2}
.card-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.art{font:500 12px var(--font-mono);color:var(--muted);letter-spacing:.02em}
.card h3{font:600 17px/1.25 var(--font-head);overflow-wrap:anywhere}
.card h3 button{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit}
.card h3 button:hover{color:var(--accent)}
.ks{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:2px 0 4px}
.ks div{min-width:0}
.ks dt{font-size:11.5px;color:var(--muted);line-height:1.25}
.ks dd{margin:0;font:500 13.5px/1.3 var(--font-mono);overflow-wrap:anywhere}
.card-a{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.card-a .btn{flex:1;padding:0 8px}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:36px 18px;text-align:center;color:var(--muted);background:var(--surface)}
.empty strong{display:block;color:var(--ink);font:600 18px var(--font-head);margin-bottom:4px}

/* product */
.pdp{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:start}
.gal-main{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.gal-main .pic{aspect-ratio:3/2;padding:14px 18px}
.gal-th{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.gal-th button{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0;overflow:hidden;text-align:center;font-size:12px;color:var(--muted)}
.gal-th button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);color:var(--ink)}
.gal-th .pic{aspect-ratio:3/2;padding:3px 6px}
.gal-th span{display:block;padding:4px 4px 6px}
.pdp-i{display:grid;gap:14px}
.pdp-i h1{font:600 32px/1.12 var(--font-head);text-wrap:balance}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface);display:grid;gap:0}
.pill small{font-size:11px;color:var(--muted)}
.pill span{font:500 14px var(--font-mono)}
.pdp-i .lead{color:var(--ink);max-width:62ch}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:13px;color:var(--muted)}
.sec{margin-top:36px}
.sec>h2{font:600 22px/1.2 var(--font-head);margin-bottom:12px}
.spec{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.spec th,.spec td{padding:9px 14px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:baseline}
.spec tr:last-child th,.spec tr:last-child td{border-bottom:0}
.spec th{width:46%;font-weight:400;color:var(--muted)}
.spec td{font:500 14px var(--font-mono)}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr));gap:10px}
.doc{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:10px 12px;text-align:left}
.doc:hover{border-color:var(--ink)}
.doc i{font:600 10px var(--font-mono);font-style:normal;border:1px solid var(--line);border-radius:3px;padding:3px 5px;color:var(--muted);flex:none}
.doc span{display:grid;line-height:1.3;min-width:0}
.doc small{color:var(--muted);font-size:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.use{margin:0;padding-left:18px;display:grid;gap:4px}

/* forms + modal */
.field{display:grid;gap:5px;min-width:0}
.field>span,.field>label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:40px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2)}
.field textarea{min-height:92px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field.err input,.field.err select,.field.err textarea{border-color:var(--bad)}
.field .em{font-size:12px;color:var(--bad);min-height:0}
.form-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form-g .full{grid-column:1/-1}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.agree input{margin-top:3px;accent-color:var(--accent)}
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(10,14,18,.55);display:grid;place-items:start center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{width:min(100%,640px);margin-block:4vh;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:grid}
.modal.big{width:min(100%,820px)}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-head h2{font:600 22px/1.2 var(--font-head)}
.m-body{padding:18px 20px;display:grid;gap:16px}
.m-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 12px 12px}
.kp-list{display:grid;gap:8px}
.kp-it{display:grid;grid-template-columns:minmax(0,1fr) 84px 36px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;background:var(--surface-2)}
.kp-it .nm{display:grid;line-height:1.3;min-width:0}
.kp-it .nm b{font-weight:500;overflow-wrap:anywhere}
.kp-it input{width:100%;height:36px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--surface);text-align:center;font-family:var(--font-mono)}
.ok-box{display:grid;gap:8px;text-align:center;padding:14px 4px}
.ok-box .tick{width:52px;height:52px;border-radius:50%;background:var(--ok-tint);color:var(--ok);display:grid;place-items:center;margin:0 auto;font-size:26px}
.ok-box strong{font:600 22px var(--font-head)}
#toasts{position:fixed;left:50%;translate:-50% 0;bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:100;display:grid;gap:8px;justify-items:center;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}
@media (prefers-reduced-motion: reduce){.toast{animation:none}}

/* contacts */
.contacts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:start}
.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:20px;display:grid;gap:14px}
.panel h2{font:600 22px/1.2 var(--font-head)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0}
.dl dt{color:var(--muted);font-size:13px}
.dl dd{margin:0}

/* admin */
.adm-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.adm-head h1{font:600 30px/1.1 var(--font-head)}

.sw{position:relative;width:38px;height:22px;border-radius:11px;border:0;background:var(--line);padding:0;transition:background .15s}

.res-ok{color:var(--ok)}

.foot{border-top:1px solid var(--line);background:var(--surface);margin-top:40px}

/* ---------- фильтрация ---------- */
function matchQ(p, q) {
  if (!q) return true;
  const s = lc(p.name + ' ' + p.article + ' ' + p.desc + ' ' + Object.values(p.specs).join(' '));
  return lc(q).split(/\s+/).filter(Boolean).every((w) => s.includes(w));
}
function passes(p, F, skip) {
  for (const spec of schemaOf(p.sub)) {
    if (spec.k === skip || !spec.filter) continue;
    const f = F[spec.k];
    if (!f) continue;
    const v = p.specs[spec.k];
    if (spec.type === 'num') { if (typeof v !== 'number' || v < f.min - 1e-9 || v > f.max + 1e-9) return false; }
    else if (f.length && !f.includes(String(v))) return false;
  }
  return true;
}
const SUB_ORDER = Object.fromEntries(CATS.flatMap((c) => c.subs).map((s, i) => [s, i]));
function sorter() {
  const [k, dir] = S.sort.split(':');
  const byName = (a, b) => a.name.localeCompare(b.name, 'ru', {numeric: true});
  if (k === 'name') return (a, b) => SUB_ORDER[a.sub] - SUB_ORDER[b.sub] || byName(a, b);
  if (k === 'art') return (a, b) => a.article.localeCompare(b.article, 'ru', {numeric: true});
  const m = dir === 'desc' ? -1 : 1;
  return (a, b) => ((a.specs[k] ?? Infinity) - (b.specs[k] ?? Infinity)) * m || byName(a, b);
}
function results() {
  const F = S.sub ? (S.F[S.sub] || {}) : {};
  return pubList().filter((p) => (S.sub ? p.sub === S.sub : S.cat ? SUBS[p.sub].cat === S.cat : true) && matchQ(p, S.q) && (!S.sub || passes(p, F))).sort(sorter());
}
function enumValues(prods, k) {
  const set = new Set();
  prods.forEach((p) => { if (filled(p.specs[k])) set.add(String(p.specs[k])); });
  const arr = [...set];
  const numeric = arr.every((v) => /^-?\d+([.,]\d+)?$/.test(v));
  return arr.sort((a, b) => (numeric ? parseFloat(a) - parseFloat(b) : a.localeCompare(b, 'ru', {numeric: true})));
}
function bounds(prods, k) {
  const v = prods.map((p) => p.specs[k]).filter((x) => typeof x === 'number' && Number.isFinite(x));
  if (!v.length) return null;
  const min = Math.min(...v);
  const max = Math.max(...v);
  const span = max - min;
  let step = span <= 3 ? 0.05 : span <= 20 ? 0.1 : span <= 60 ? 0.5 : span <= 400 ? 1 : span <= 3000 ? 5 : 10;
  if (step < 1 && v.every(Number.isInteger)) step = 1;
  return {min, max, step};
}
function activeCount() {
  let n = S.q ? 1 : 0;
  if (S.sub) {
    const F = S.F[S.sub] || {};
    for (const spec of schemaOf(S.sub)) { const f = F[spec.k]; if (f) n += spec.type === 'num' ? 1 : f.length; }
  }
  return n;
}

function renderFilters() {

  }
  const prods = pubList().filter((p) => p.sub === S.sub);
  const F = (S.F[S.sub] = S.F[S.sub] || {});
  const parts = [];
  for (const spec of schemaOf(S.sub)) {
    if (!spec.filter) continue;
    const head = `<summary>${esc(spec.label)}<span class="u">${esc(spec.unit)}</span></summary>`;
    if (spec.type === 'num') {
      const b = bounds(prods, spec.k);
      if (!b || b.min === b.max) continue;
      parts.push(`<details class="fs" open data-k="${spec.k}">${head}<div class="fs-body"><div class="rng" data-k="${spec.k}" data-min="${b.min}" data-max="${b.max}" data-step="${b.step}">

    } else {
      const vals = enumValues(prods, spec.k);
      if (vals.length < 2) continue;
      parts.push(`<details class="fs" open data-k="${spec.k}">${head}<div class="fs-body">${vals.map((v) => `<label class="chk"><input type="checkbox" data-k="${spec.k}" value="${esc(v)}"${(F[spec.k] || []).includes(v) ? ' checked' : ''}><span>${esc(v)}</span><span class="cnt"></span></label>`).join('')}</div></details>`);
    }
  }
  box.innerHTML = `<div class="f-head"><h2>Подбор по параметрам</h2><button type="button" class="link" data-act="f-reset">Сбросить</button></div>${parts.join('') || '<p class="hint">Для этой подкатегории фильтры не настроены. Их можно включить в админке.</p>'}`;
  $$('.rng', box).forEach(syncRange);
  updateFacets();
}
function updateFacets() {
  if (!S.sub || !$('#filters')) return;
  const F = S.F[S.sub] || {};
  const prods = pubList().filter((p) => p.sub === S.sub && matchQ(p, S.q));
  for (const spec of schemaOf(S.sub)) {
    if (!spec.filter || spec.type !== 'enum') continue;
    const cnt = {};
    for (const p of prods) if (passes(p, F, spec.k)) { const v = String(p.specs[spec.k]); cnt[v] = (cnt[v] || 0) + 1; }
    $$('#filters .chk input').filter((i) => i.dataset.k === spec.k).forEach((inp) => {
      const lab = inp.closest('.chk');
      const n = cnt[inp.value] || 0;
      lab.querySelector('.cnt').textContent = n;
      lab.classList.toggle('zero', n === 0 && !inp.checked);
    });
  }
}
const afterFilter = () => { renderResults(); updateFacets(); };
const snapIn = (v, r) => {
  const x = +(Math.round(v / r.step) * r.step).toFixed(4);
  return x <= r.min ? r.min : x >= r.max ? r.max : x;
};
function rangeOf(el) {
  const k = el.dataset.k;
  const min = +el.dataset.min;
  const max = +el.dataset.max;
  const f = (S.F[S.sub] || {})[k];
  return {k, min, max, step: +el.dataset.step, lo: f ? f.min : min, hi: f ? f.max : max};
}
function syncRange(el) {
  const r = rangeOf(el);
  const pct = (v) => (r.max === r.min ? 0 : ((v - r.min) / (r.max - r.min)) * 100);
  const [a, b] = $$('.rng-th', el);
  a.style.left = pct(r.lo) + '%';
  b.style.left = pct(r.hi) + '%';
  const fill = $('.rng-fill', el);
  fill.style.left = pct(r.lo) + '%';
  fill.style.width = pct(r.hi) - pct(r.lo) + '%';
  [[a, r.lo], [b, r.hi]].forEach(([t, v]) => { t.setAttribute('aria-valuemin', r.min); t.setAttribute('aria-valuemax', r.max); t.setAttribute('aria-valuenow', v); t.setAttribute('aria-valuetext', num(v)); });
  const [i1, i2] = $$('input', el);
  if (document.activeElement !== i1) i1.value = num(r.lo);
  if (document.activeElement !== i2) i2.value = num(r.hi);
}
function setRange(el, lo, hi) {
  const r = rangeOf(el);
  lo = Math.min(Math.max(lo, r.min), r.max);
  hi = Math.min(Math.max(hi, r.min), r.max);
  if (lo > hi) [lo, hi] = [hi, lo];
  const F = (S.F[S.sub] = S.F[S.sub] || {});
  if (lo <= r.min + 1e-9 && hi >= r.max - 1e-9) delete F[r.k]; else F[r.k] = {min: lo, max: hi};
  syncRange(el);
  afterFilter();
}
let drag = null;
function moveDrag(x) {
  const {el, which, rect} = drag;
  const r = rangeOf(el);
  const raw = r.min + ((x - rect.left) / rect.width) * (r.max - r.min);
  const v = snapIn(raw, r);
  if (which === 'min') setRange(el, Math.min(v, r.hi), r.hi); else setRange(el, r.lo, Math.max(v, r.lo));
}

    const v = vals[(n - 1) % Math.max(1, vals.length)];

function parseCSV(text) {
  const t = text.replace(/\r/g, '').trim();
  if (!t) return [];
  const first = t.split('\n')[0];
  const delim = first.includes(';') ? ';' : first.includes('\t') ? '\t' : ',';
  const rows = [];
  let row = [];
  let cur = '';
  let q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  row.push(cur);
  rows.push(row);
  return rows;
}

    const art = (r[iA] || '').trim();
    const name = (r[iN] || '').trim();
    if (!art) errs.push('нет артикула'); else if (seen.has(lc(art))) errs.push('артикул уже есть');
    if (!name) errs.push('нет названия');
    const specs = {};
    schema.forEach((s) => {
      const c = colFor(s);
      if (c < 0) return;
      const raw = (r[c] || '').trim();
      if (!raw) return;
      if (s.type === 'num') { const v = parseNum(raw); if (v == null) errs.push(`${s.label}: не число`); else specs[s.k] = v; } else specs[s.k] = raw;
    });
    if (errs.length) res.bad.push({line: n + 2, art, name, errs});
    else { seen.add(lc(art)); res.ok.push({line: n + 2, article: art, name, desc: iD >= 0 ? (r[iD] || '').trim() : '', specs}); }
  });
  return res;
}
function csvResHTML() {
  const r = S.csvRes;
  if (!r) return '<p class="note">Нажмите «Проверить»: покажем, какие строки подойдут, а какие нужно поправить.</p>';
  if (r.err) return `<p class="res-bad">${esc(r.err)}</p>`;
  return `<p><span class="res-ok">Готово к добавлению: ${r.ok.length}</span>${r.bad.length ? ` · <span class="res-bad">с ошибками: ${r.bad.length}</span>` : ''}</p>
  ${r.bad.length ? `<h3 class="cap">Строки с ошибками: они не будут добавлены</h3><div class="tbl-w"><table class="tbl"><thead><tr><th>Строка</th><th>Артикул</th><th>Что не так</th></tr></thead><tbody>${r.bad.slice(0, 20).map((b) => `<tr><td class="m">${b.line}</td><td class="m">${esc(b.art)}</td><td class="res-bad">${esc(b.errs.join(', '))}</td></tr>`).join('')}</tbody></table></div>` : ''}
  ${r.ok.length ? `<h3 class="cap">Будут добавлены</h3><div class="tbl-w"><table class="tbl"><thead><tr><th>Строка</th><th>Артикул</th><th>Название</th><th>Характеристик</th></tr></thead><tbody>${r.ok.slice(0, 8).map((o) => `<tr><td class="m">${o.line}</td><td class="m">${esc(o.article)}</td><td>${esc(o.name)}</td><td class="m">${Object.keys(o.specs).length}</td></tr>`).join('')}</tbody></table></div>${r.ok.length > 8 ? `<p class="note">…и ещё ${r.ok.length - 8}</p>` : ''}` : ''}`;
}
function admImport() {
  const cols = ['article', 'name', 'description', ...schemaOf(S.csvSub).map((s) => s.k)];
  return `<div class="panel"><h2>Массовая загрузка из CSV</h2>
    <p class="note" style="max-width:80ch">Выберите подкатегорию и вставьте строки из Excel (разделитель: точка с запятой или табуляция) либо загрузите файл .csv. Колонки: ${cols.map((c) => `<code class="mono">${esc(c)}</code>`).join(', ')}. Числа можно писать с запятой. Первая строка: заголовки.</p>
    <div class="bar"><label class="sr" for="csv-sub">Подкатегория</label><select class="sel" id="csv-sub">${subOptions(S.csvSub, false)}</select>
      <button type="button" class="btn sm" data-act="csv-tpl">Вставить шаблон</button>
      <label class="btn sm" for="csv-file">Загрузить файл…</label><input type="file" id="csv-file" accept=".csv,.txt,text/csv" class="sr"></div>
    <label class="sr" for="csv-ta">Данные CSV</label><textarea class="csv-ta" id="csv-ta" spellcheck="false" placeholder="article;name;description;…">${esc(S.csvText)}</textarea>
    <div class="bar"><button type="button" class="btn" data-act="csv-check">Проверить</button><button type="button" class="btn pri" id="csv-go" data-act="csv-import"${S.csvRes && S.csvRes.ok && S.csvRes.ok.length ? '' : ' disabled'}>Добавить ${S.csvRes && S.csvRes.ok ? S.csvRes.ok.length : 0} товаров</button></div>
    <div id="csv-res">${csvResHTML()}</div></div>`;
}

/* ---------- события ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  const id = el.dataset.id;
  if (a === 'modal-bg') { if (e.target === el) closeModal(); return; }
  if (a === 'modal-close') return closeModal();
  if (a === 'home') return goHome();
  if (a === 'nav') {
    if (el.dataset.v === 'catalog') return goHome();
    if (el.dataset.v === 'admin') S.arm = '';
    return setView(el.dataset.v);
  }
  if (a === 'more') {
    S.limit += PAGE;
    renderResults();
    const c = $$('#grid .card')[S.limit - PAGE];
    if (c) $('h3 button', c).focus({preventScroll: true});
    return;
  }
  if (a === 'search-all') { S.cat = null; S.sub = null; return setView('catalog'); }
  if (a === 'cat') { S.sort = 'name'; return setView('catalog', {cat: id, sub: null}); }
  if (a === 'sub') { S.sort = 'name'; closeSide(); return setView('catalog', {cat: SUBS[id].cat, sub: id}); }
  if (a === 'open') { S.pid = id; return setView('product'); }
  if (a === 'img') {
    const p = byId(S.pid);
    const i = +el.dataset.i;
    $('#gal-main').innerHTML = `<div class="pic">${[illus(p.sub, p.name), dimSVG(p), plateSVG(p, schemaOf(p.sub))][i]}</div>`;
    $$('.gal-th button').forEach((b) => b.setAttribute('aria-pressed', String(b === el)));
    return;
  }
  if (a === 'kp-add') {
    if (S.kp.some((k) => k.id === id)) return openKp();
    S.kp.push({id, qty: 1});
    updateKpBadge();
    refreshKpButtons();
    return toast('Добавлено в запрос КП');
  }
  if (a === 'kp-open') return openKp();
  if (a === 'kp-rm') { S.kp = S.kp.filter((k) => k.id !== id); updateKpBadge(); refreshKpButtons(); return openKp(); }
  if (a === 'doc') return toast('Документ подключается при наполнении каталога.');
  if (a === 'ask') { const p = byId(id); S.fbTopic = 'Техническая консультация'; S.fbText = `Вопрос по позиции ${p.name} (${p.article}): `; return setView('contacts'); }
  if (a === 'f-reset') { S.F[S.sub] = {}; renderFilters(); return renderResults(); }
  if (a === 'f-reset-all') { if (S.sub) S.F[S.sub] = {}; S.q = ''; $('#q').value = ''; renderFilters(); return renderResults(); }
  if (a === 'chip-x') {
    const {kind, key} = el.dataset;
    if (kind === 'q') { S.q = ''; $('#q').value = ''; }
    else if (kind === 'n') delete S.F[S.sub][key];
    else { const [k, v] = key.split('|'); S.F[S.sub][k] = (S.F[S.sub][k] || []).filter((x) => x !== v); if (!S.F[S.sub][k].length) delete S.F[S.sub][k]; }
    renderFilters();
    return renderResults();
  }
  if (a === 'side-open') { $('#side').classList.add('open'); return; }
  if (a === 'side-close') return closeSide();
  if (a === 'go-leads') { closeModal(); S.tab = 'leads'; return setView('admin'); }
  /* админка */
  if (a === 'tab') { S.tab = id; S.arm = ''; return viewAdmin(); }
  if (a === 'adm-add') return openEditor(null);
  if (a === 'adm-edit') return openEditor(id);
  if (a === 'adm-pub') { const p = byId(id); p.pub = !p.pub; save(); renderAdmRows(); return; }
  if (a === 'adm-del') {
    if (S.arm !== id) { S.arm = id; return renderAdmRows(); }
    DB.products = DB.products.filter((p) => p.id !== id);
    S.kp = S.kp.filter((k) => k.id !== id);
    S.arm = '';
    save();
    toast('Товар удалён');
    return refreshAdmin();
  }
  if (a === 'adm-reset') {
    if (S.arm !== 'reset') { S.arm = 'reset'; return viewAdmin(); }
    DB = seedDB();
    S.F = {}; S.kp = []; S.arm = '';
    try { localStorage.removeItem(LS_KEY); } catch (err) { /* ничего */ }
    toast('Данные восстановлены');
    return viewAdmin();
  }
  if (a === 'sp-up' || a === 'sp-down') {
    const list = schemaOf(S.ssub);
    const i = list.findIndex((s) => s.k === el.dataset.k);
    const j = a === 'sp-up' ? i - 1 : i + 1;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    save();
    return renderAdminTab();
  }
  if (a === 'sp-del') {
    const k = el.dataset.k;
    if (S.arm !== 'sp:' + k) { S.arm = 'sp:' + k; return renderAdminTab(); }
    DB.schemas[S.ssub] = schemaOf(S.ssub).filter((s) => s.k !== k);
    DB.products.filter((p) => p.sub === S.ssub).forEach((p) => { delete p.specs[k]; });
    if (S.F[S.ssub]) delete S.F[S.ssub][k];
    S.arm = '';
    save();
    toast('Характеристика удалена');
    return renderAdminTab();
  }
  if (a === 'lead-open') { const n = +id; S.leadOpen = S.leadOpen === n ? null : n; return renderAdminTab(); }
  if (a === 'leads-clear') { DB.leads = []; save(); return viewAdmin(); }
  if (a === 'csv-tpl') { S.csvText = csvTemplate(); S.csvRes = null; return renderAdminTab(); }
  if (a === 'csv-check') { S.csvText = $('#csv-ta').value; S.csvRes = csvCheck(); return renderAdminTab(); }
  if (a === 'csv-import') {
    const r = S.csvRes;
    if (!r || !r.ok || !r.ok.length) return;
    r.ok.forEach((o) => DB.products.push({id: 'p' + (++DB.seq), sub: S.csvSub, model: o.name, name: o.name, article: o.article, desc: o.desc, specs: o.specs, pub: true}));
    save();
    toast(`Добавлено товаров: ${r.ok.length}`);
    S.csvText = ''; S.csvRes = null;
    return viewAdmin();
  }
});
function closeSide() { const s = $('#side'); if (s) s.classList.remove('open'); }
function goHome() {
  S.cat = null;
  S.sub = null;
  S.q = '';
  $('#q').value = '';
  setView('catalog');
}
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'kp-form') submitKp(f);
  else if (f.id === 'fb-form') submitFeedback(f);
  else if (f.id === 'ed-form') saveEditor(f);
  else if (f.id === 'sp-new') {
    const d = readForm(f);
    if (!d.label) return setErr(f, {label: 'Укажите название'});
    DB.schemas[S.ssub].push({k: 'c_' + (++DB.seq), label: d.label, unit: d.unit, type: d.type, filter: true, card: false});
    save();
    toast('Характеристика добавлена. Заполните её в карточках товаров');
    renderAdminTab();
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  const fe = t.closest && t.closest('.field.err');
  if (fe) { fe.classList.remove('err'); const em = $('.em', fe); if (em) em.textContent = ''; }
  if (t.id === 'q') {
    S.q = t.value.trim();
    if (S.view !== 'catalog') { S.cat = null; S.sub = null; return setView('catalog'); }
    renderResults();
    return updateFacets();
  }
  if (t.id === 'adm-q') { S.aq = t.value; return renderAdmRows(); }
  if (t.dataset.qty) { const k = S.kp.find((x) => x.id === t.dataset.qty); if (k) k.qty = Math.max(1, Math.min(9999, parseInt(t.value, 10) || 1)); return; }
  const row = t.closest && t.closest('.sp-row');
  if (row && t.dataset.sp && t.type === 'text') {
    const s = schemaOf(S.ssub).find((x) => x.k === row.dataset.k);
    s[t.dataset.sp] = t.value;
    save();
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.name === 'agree') { const em = $('.agree .em', t.closest('form')); if (em) em.textContent = ''; }
  if (t.id === 'sort') { S.sort = t.value; return renderResults(); }
  if (t.matches('#filters .chk input')) {
    const F = (S.F[S.sub] = S.F[S.sub] || {});
    const cur = new Set(F[t.dataset.k] || []);
    if (t.checked) cur.add(t.value); else cur.delete(t.value);
    if (cur.size) F[t.dataset.k] = [...cur]; else delete F[t.dataset.k];
    return afterFilter();
  }
  if (t.matches('.rng-in input')) {
    const el = t.closest('.rng');
    const r = rangeOf(el);
    const v = parseNum(t.value);
    if (v == null) return syncRange(el);
    if (t.dataset.in === 'min') setRange(el, Math.min(v, r.hi), r.hi); else setRange(el, r.lo, Math.max(v, r.lo));
    return syncRange(el);
  }
  if (t.id === 'adm-sub') { S.asub = t.value; return renderAdmRows(); }
  if (t.id === 'ssub') { S.ssub = t.value; S.arm = ''; return renderAdminTab(); }
  if (t.id === 'lead-f') { S.lf = t.value; return renderAdminTab(); }
  if (t.id === 'csv-sub') { S.csvSub = t.value; S.csvRes = null; S.csvText = $('#csv-ta').value; return renderAdminTab(); }
  if (t.id === 'ed-sub') { $('#ed-specs').innerHTML = specFields(t.value, null); return; }
  if (t.dataset.lead) { const l = DB.leads.find((x) => x.id === +t.dataset.lead); l.status = t.value; save(); return viewAdmin(); }
  if (t.id === 'csv-file') {
    const f = t.files && t.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => { S.csvText = String(fr.result || ''); S.csvRes = null; renderAdminTab(); };
    fr.readAsText(f);
    return;
  }
  const row = t.closest && t.closest('.sp-row');
  if (row && t.dataset.sp) {
    const s = schemaOf(S.ssub).find((x) => x.k === row.dataset.k);
    if (t.type === 'checkbox') { s[t.dataset.sp] = t.checked; if (t.dataset.sp === 'filter' && !t.checked && S.F[S.ssub]) delete S.F[S.ssub][s.k]; }
    else if (t.dataset.sp === 'type') {
      s.type = t.value;
      if (S.F[S.ssub]) delete S.F[S.ssub][s.k];
      DB.products.filter((p) => p.sub === S.ssub).forEach((p) => {
        if (!filled(p.specs[s.k])) return;
        if (t.value === 'num') { const n = parseNum(p.specs[s.k]); if (n == null) delete p.specs[s.k]; else p.specs[s.k] = n; } else p.specs[s.k] = String(p.specs[s.k]);
      });
    }
    save();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if ($('#modal-root').firstChild) closeModal(); else closeSide(); return; }
  if (e.key === 'Enter' && e.target.id === 'q') { e.target.blur(); return; }
  const modal = $('#modal-root .modal');
  if (e.key === 'Tab' && modal) {
    const f = $$('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled])', modal);
    if (f.length) {
      const cur = document.activeElement;
      if (e.shiftKey && (cur === f[0] || cur === modal)) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && (cur === f[f.length - 1] || !modal.contains(cur))) { e.preventDefault(); f[0].focus(); }
    }
    return;
  }
  const th = e.target.closest && e.target.closest('.rng-th');
  if (!th) return;
  const el = th.closest('.rng');
  const r = rangeOf(el);
  const m = {ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1, PageDown: -10, PageUp: 10}[e.key];
  const which = th.dataset.th;
  if (e.key === 'Home' || e.key === 'End') {
    e.preventDefault();
    const v = e.key === 'Home' ? r.min : r.max;
    return which === 'min' ? setRange(el, Math.min(v, r.hi), r.hi) : setRange(el, r.lo, Math.max(v, r.lo));
  }
  if (!m) return;
  e.preventDefault();
  const cur = which === 'min' ? r.lo : r.hi;
  const v = snapIn(cur + m * r.step, r);
  if (which === 'min') setRange(el, Math.min(v, r.hi), r.hi); else setRange(el, r.lo, Math.max(v, r.lo));
  const again = $$('.rng-th', el).find((x) => x.dataset.th === which);
  if (again) again.focus();
});
document.addEventListener('pointerdown', (e) => {
  const th = e.target.closest && e.target.closest('.rng-th');
  if (!th) return;
  const el = th.closest('.rng');
  drag = {el, which: th.dataset.th, rect: $('.rng-track', el).getBoundingClientRect()};
  try { th.setPointerCapture(e.pointerId); } catch (err) { /* ничего */ }
  e.preventDefault();
  th.focus();
});
document.addEventListener('pointermove', (e) => { if (drag) moveDrag(e.clientX); });
['pointerup', 'pointercancel'].forEach((n) => document.addEventListener(n, () => { drag = null; }));

render();
})();
</script>
